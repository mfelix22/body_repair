version: '3.8'

services:

  # ─── Laravel App (PHP + Apache) ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: body_repair_app
    restart: unless-stopped
    ports:
      - "6060:80"
    environment:
      APP_NAME: "Body Repair"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:6060}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: body_repair
      DB_USERNAME: body_repair
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-error}
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    networks:
      - body_repair_network
    depends_on:
      db:
        condition: service_healthy

  # ─── MySQL Database ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: body_repair_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: body_repair
      MYSQL_USER: body_repair
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
      - ./body_repair.sql:/docker-entrypoint-initdb.d/body_repair.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - body_repair_network

  # ─── phpMyAdmin ──────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: body_repair_phpmyadmin
    restart: unless-stopped
    ports:
      - "6081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: body_repair
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      UPLOAD_LIMIT: 300M
    networks:
      - body_repair_network
    depends_on:
      db:
        condition: service_healthy

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  body_repair_network:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  db_data:
  app_storage:
  app_logs:
