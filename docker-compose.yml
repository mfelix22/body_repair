version: '3.8'

services:

  # ─── Laravel App (PHP-FPM) ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: body_repair_app
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: body_repair
      DB_USERNAME: body_repair
      DB_PASSWORD: secret
    volumes:
      - app_storage:/var/www/storage
    networks:
      - body_repair_network
    depends_on:
      db:
        condition: service_healthy

  # ─── Nginx Web Server ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: body_repair_nginx
    restart: unless-stopped
    ports:
      - "6080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/storage:ro
      - ./public:/var/www/public:ro
    networks:
      - body_repair_network
    depends_on:
      - app

  # ─── MySQL Database ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: body_repair_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: body_repair
      MYSQL_USER: body_repair
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
      - ./body_repair.sql:/docker-entrypoint-initdb.d/body_repair.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - body_repair_network

  # ─── phpMyAdmin ──────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: body_repair_phpmyadmin
    restart: unless-stopped
    ports:
      - "6081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: body_repair
      PMA_PASSWORD: secret
      UPLOAD_LIMIT: 300M
    networks:
      - body_repair_network
    depends_on:
      db:
        condition: service_healthy

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  body_repair_network:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  db_data:
  app_storage:
